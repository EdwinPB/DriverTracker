name: Feature request
description: Propose a new feature
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests that align with the module boundaries ship faster. See `Docs/architecture.md` for the package map.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? A short story beats a wish list.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature do?
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package owns this?
      description: Where does the bulk of the logic belong?
      options:
        - Core
        - Domain
        - Networking
        - Storage
        - Location
        - Analytics
        - DesignSystem
        - Authentication
        - SyncEngine
        - App target (composition only — rarely correct)
        - Not sure / cross-package
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contract impact
      description: Mark any that apply.
      options:
        - Adds a new Domain protocol or entity
        - Changes an existing Domain protocol (breaking)
        - Adds a package dependency (README + whitelist must change)
        - Introduces remote (url:) package dependency
        - Imports Testing into a production target
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable outcomes. e.g. "Given a trip in progress, when the app is killed and relaunched, the trip resumes."
